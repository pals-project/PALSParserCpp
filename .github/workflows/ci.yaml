name: C++ CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: C++ ${{ matrix.build_type }} - ${{ github.event_name }}
    runs-on: ubuntu-latest
    permissions: 
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Debug keeps rapidyaml's own checks, which Release compiles out: they
        # abort on a node read as the wrong type (find_child on a list, say)
        # that a Release build passes over silently.
        build_type: [Release, Debug]
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
      - run: cmake --build build --parallel
      - run: ctest --test-dir build --output-on-failure --verbose --no-compress-output

  windows:
    name: C++ Windows (MSVC) Release - ${{ github.event_name }}
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      # Visual Studio is a multi-configuration generator: the configuration is
      # chosen when building and testing, not with CMAKE_BUILD_TYPE.
      - run: cmake -S . -B build
      - run: cmake --build build --config Release --parallel
      - run: ctest --test-dir build -C Release --output-on-failure --no-compress-output

  system-dependencies:
    name: Installed dependencies - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Build and install dependencies
        shell: bash
        run: |
          set -euxo pipefail
          prefix="$RUNNER_TEMP/pals-prefix"
          git clone --branch v0.15.0 --depth 1 --recurse-submodules https://github.com/biojppm/rapidyaml.git "$RUNNER_TEMP/ryml"
          git clone --branch pcre2-10.44 --depth 1 https://github.com/PCRE2Project/pcre2.git "$RUNNER_TEMP/pcre2"
          git clone --branch v0.12.0 --depth 1 https://github.com/pals-project/AtomicAndPhysicalConstantsCLib.git "$RUNNER_TEMP/apc"
          git clone --branch v3.5.2 --depth 1 https://github.com/catchorg/Catch2.git "$RUNNER_TEMP/catch2"
          cmake -S "$RUNNER_TEMP/ryml" -B "$RUNNER_TEMP/ryml-build" -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$prefix" -DCMAKE_INSTALL_LIBDIR=lib -DBUILD_SHARED_LIBS=ON
          cmake --build "$RUNNER_TEMP/ryml-build" --parallel 2
          cmake --install "$RUNNER_TEMP/ryml-build"
          cmake -S "$RUNNER_TEMP/pcre2" -B "$RUNNER_TEMP/pcre2-build" -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$prefix" -DCMAKE_INSTALL_LIBDIR=lib -DBUILD_SHARED_LIBS=ON -DPCRE2_BUILD_PCRE2_16=OFF -DPCRE2_BUILD_PCRE2_32=OFF -DPCRE2_BUILD_TESTS=OFF -DPCRE2_BUILD_PCRE2GREP=OFF
          cmake --build "$RUNNER_TEMP/pcre2-build" --parallel 2
          cmake --install "$RUNNER_TEMP/pcre2-build"
          cmake -S "$RUNNER_TEMP/apc" -B "$RUNNER_TEMP/apc-build" -DCMAKE_BUILD_TYPE=Release -DAPC_BUILD_TESTS=OFF
          cmake --build "$RUNNER_TEMP/apc-build" --target apc --parallel 2
          cmake -S "$RUNNER_TEMP/catch2" -B "$RUNNER_TEMP/catch2-build" -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$prefix" -DCATCH_BUILD_TESTING=OFF
          cmake --build "$RUNNER_TEMP/catch2-build" --parallel 2
          cmake --install "$RUNNER_TEMP/catch2-build"
      - name: Test system dependency build
        shell: bash
        run: |
          set -euxo pipefail
          cmake -S . -B build-system -DCMAKE_BUILD_TYPE=Release -DPALS_USE_SYSTEM_DEPS=ON -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/pals-prefix" -DPALS_APC_INCLUDE_DIR="$RUNNER_TEMP/apc/include" -DPALS_APC_LIBRARY="$RUNNER_TEMP/apc-build/libapc.a" -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/pals-prefix"
          cmake --build build-system --parallel 2
          ctest --test-dir build-system --output-on-failure
      - name: Install library-only component and load without loader overrides
        shell: bash
        run: |
          set -euxo pipefail
          cmake -S . -B build-package -DCMAKE_BUILD_TYPE=Release -DPALS_USE_SYSTEM_DEPS=ON -DBUILD_TESTING=OFF -DPALS_BUILD_EXAMPLES=OFF -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/pals-prefix" -DPALS_APC_INCLUDE_DIR="$RUNNER_TEMP/apc/include" -DPALS_APC_LIBRARY="$RUNNER_TEMP/apc-build/libapc.a" -DCMAKE_INSTALL_LIBDIR=lib -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/pals-prefix"
          cmake --build build-package --parallel 2
          cmake --install build-package --component PALSParserCpp --prefix "$RUNNER_TEMP/component-only"
          test -f "$RUNNER_TEMP/component-only/include/PALSParserCpp.h"
          test "$(find "$RUNNER_TEMP/component-only" -type f | wc -l | tr -d ' ')" = 3
          cmake --install build-package --component PALSParserCpp
          python3 - <<'PYCODE'
          import ctypes, os, pathlib, sys
          suffix = 'dylib' if sys.platform == 'darwin' else 'so'
          lib = pathlib.Path(os.environ['RUNNER_TEMP']) / 'pals-prefix' / 'lib' / ('libPALSParserCpp.' + suffix)
          ctypes.CDLL(str(lib))
          PYCODE

  conda-forge-dependencies-windows:
    # The conda-forge palsparsercpp package is built against conda-forge's own
    # rapidyaml, PCRE2 and Catch2, which on Windows are DLLs, with a static
    # AtomicAndPhysicalConstantsCLib linked in. This job builds the same way.
    name: conda-forge dependencies - windows-latest
    runs-on: windows-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: pals
          condarc: |
            channels:
              - conda-forge
          create-args: >-
            librapidyaml=0.15.0
            pcre2
            catch2
            python
          init-shell: bash
      - name: Build AtomicAndPhysicalConstantsCLib
        run: |
          set -euxo pipefail
          tmp=$(cygpath -m "$RUNNER_TEMP")
          git clone --branch v0.12.0 --depth 1 https://github.com/pals-project/AtomicAndPhysicalConstantsCLib.git "$tmp/apc"
          cmake -S "$tmp/apc" -B "$tmp/apc-build" -DAPC_BUILD_TESTS=OFF
          cmake --build "$tmp/apc-build" --config Release --target apc
      - name: Build and test against conda-forge's dependencies
        run: |
          set -euxo pipefail
          tmp=$(cygpath -m "$RUNNER_TEMP")
          prefix=$(cygpath -m "$CONDA_PREFIX/Library")
          cmake -S . -B build-conda -DPALS_USE_SYSTEM_DEPS=ON -DPALS_BUILD_EXAMPLES=OFF \
            -DCMAKE_PREFIX_PATH="$prefix" -DCMAKE_INSTALL_PREFIX="$prefix" \
            -DPALS_APC_INCLUDE_DIR="$tmp/apc/include" \
            -DPALS_APC_LIBRARY="$tmp/apc-build/Release/apc.lib"
          cmake --build build-conda --config Release --parallel
          ctest --test-dir build-conda -C Release --output-on-failure
      # conda puts a Windows DLL in Library\bin, beside the DLLs it depends on,
      # which is where palsparserpy looks for it.
      - name: Install the library and load it as palsparserpy does
        run: |
          set -euxo pipefail
          cmake --install build-conda --config Release --component PALSParserCpp
          python -c "import ctypes, os, sys; ctypes.CDLL(os.path.join(sys.prefix, 'Library', 'bin', 'PALSParserCpp.dll'))"

  build-docs:
    name: Build Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Doxygen
        run: sudo apt-get update && sudo apt-get install -y doxygen

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # docs/build.py runs Doxygen (API -> XML), pip-installs the Sphinx
      # toolchain, and builds the MyST + Furo site (Breathe embeds the API)
      # into docs/build/html. Runs on every push/PR to verify the docs build.
      - name: Build documentation site
        run: python docs/build.py

      # Packages the HTML into a zip file for the next job
      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './docs/build/html'

  deploy-docs:
    name: Deploy to GitHub Pages
    needs: build-docs
    runs-on: ubuntu-latest
    # This prevents the job (and the environment) from running on PRs/branches
    if: github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4