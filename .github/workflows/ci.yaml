name: C++ CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: C++ ${{ matrix.build_type }} - ${{ github.event_name }}
    runs-on: ubuntu-latest
    permissions: 
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Debug keeps rapidyaml's own checks, which Release compiles out: they
        # abort on a node read as the wrong type (find_child on a list, say)
        # that a Release build passes over silently.
        build_type: [Release, Debug]
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
      - run: cmake --build build --parallel
      - run: ctest --test-dir build --output-on-failure --verbose --no-compress-output

  build-docs:
    name: Build Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Doxygen
        run: sudo apt-get update && sudo apt-get install -y doxygen

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # docs/build.py runs Doxygen (API -> XML), pip-installs the Sphinx
      # toolchain, and builds the MyST + Furo site (Breathe embeds the API)
      # into docs/build/html. Runs on every push/PR to verify the docs build.
      - name: Build documentation site
        run: python docs/build.py

      # Packages the HTML into a zip file for the next job
      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './docs/build/html'

  deploy-docs:
    name: Deploy to GitHub Pages
    needs: build-docs
    runs-on: ubuntu-latest
    # This prevents the job (and the environment) from running on PRs/branches
    if: github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4