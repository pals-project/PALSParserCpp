# Layout half of the load example: what the machine is made of.
# See load_joiner.pals.yaml.
PALS:
  version: "0.1"

  notes:
    - "Layout only. Magnet settings live in load_settings.pals.yaml."

  facility:
    - Q1a:
        kind: Quadrupole
        length: 0.5
    - Q1b:
        kind: Quadrupole
        length: 0.5

    - main:
        kind: BeamLine
        line:
          - begin:
              kind: BeginningEle
              ReferenceP:
                species_ref: "electron"
                E_tot_ref: 1.0e9
          - Q1a
          - D1:
              kind: Drift
              length: 1.2
          - Q1b

    - lat1:
        kind: Lattice
        branches:
          - main

    - use: "lat1"
